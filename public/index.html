    <!-- ECharts (usado por el módulo Skill Analysis).
         Carga local primero (/libs/echarts/echarts.min.js) y si falla, cae a CDN. -->
    <script>
        (function loadECharts(){
            function load(src) {
                var s = document.createElement('script');
                s.src = src;
                s.defer = true;
                s.crossOrigin = 'anonymous';
                s.onerror = function() {
                    // Si falló la carga local, intentar CDN
                    if (src.indexOf('cdn.jsdelivr.net') === -1) {
                        load('https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js');
                    } else {
                        console.error('Failed to load ECharts from', src);
                    }
                };
                document.head.appendChild(s);
            }
            // Intentar cargar primero la copia local (para builds offline)
            load('/libs/echarts/echarts.min.js');
        })();
    </script>

        window.__socket.on('disconnect', () => console.log('Desconectado del servidor Socket.IO'));
        window.__socket.on('server_log', (logData) => {
            try {
                const level = (logData.level || 'info').toString().toLowerCase();
                const ts = logData.timestamp || new Date().toISOString();
                const msg = logData.message || '';
                const label = `[SERVER_LOG] [${level.toUpperCase()}]`;
                if (level === 'warn' || level === 'warning') console.warn(`${label} ${msg}`, ts);
                else if (level === 'error') console.error(`${label} ${msg}`, ts);
                else console.info(`${label} ${msg}`, ts);
                // También mostrar el objeto crudo para depuración
                console.debug('[SERVER_LOG RAW]', logData);
            } catch (e) {
                console.log('[SERVER_LOG] (parse error)', logData);
            }
        });
    } catch (e) {
        // fallo al inicializar socket (por ejemplo io no está cargado aún)
        console.warn('No se pudo inicializar socket global:', e.message || e);
    }

    let lastTotalDamage = 0;

        const resetButton = document.getElementById('reset-button');

        // Lógica para el nuevo botón ExitLag
        if (exitLagButton) {
                const candidates = ['/api/settings', '/api/alternative-settings'];

                for (let i = 0; i < candidates.length; i++) {
                    try {
                        const response = await fetch(candidates[i]);
                        if (!response.ok) continue;
                        const settings = await response.json();
                        autoClearOnServerChange = (settings && settings.data && typeof settings.data.autoClearOnServerChange !== 'undefined')
                            ? settings.data.autoClearOnServerChange
                            : autoClearOnServerChange;
                        exitLagButton.classList.toggle('active', !autoClearOnServerChange);

                        // intentar el siguiente candidato
                        continue;

        const totalContentHeightUnscaled = headerHeight + marginTop + borderWidth + barsHeight + 20; // Búfer de 20px
        // If Skill Analysis view is visible, compute a larger target size
        const skillContainer = document.getElementById('skill-analysis-container');
        let finalWidth = Math.round(baseWidth * currentZoom);
        let finalHeight = Math.round(totalContentHeightUnscaled * currentZoom);

        }

    function updateSyncButtonState() {
        clearTimeout(syncTimerDisplayTimeout); // Limpiar cualquier timeout pendiente

        if (syncTimerInterval) { // Si el temporizador está activo (hay cuenta regresiva)
            if (syncCountdown <= 60) {
                // Mostrar temporizador, ocultar icono
                syncIcon.style.display = 'none';
                syncIcon.classList.remove('spinning');
                syncTimerSpan.innerText = `${syncCountdown}s`;
                syncTimerSpan.style.display = 'block';
            } else {
                // Mostrar icono girando, ocultar temporizador
                syncIcon.style.display = 'block';
                syncIcon.classList.add('spinning'); // Asegura que gire continuamente
                syncTimerSpan.style.display = 'none';
            }
        } else { // Si el temporizador no está activo (no hay cuenta regresiva)
            // Mostrar icono girando, ocultar temporizador
            syncIcon.style.display = 'block';
            syncIcon.classList.add('spinning'); // Asegura que gire continuamente
            syncTimerSpan.style.display = 'none';
            syncTimerSpan.innerText = '';
        }
    }

    function startSyncTimer() {
        if (syncTimerInterval) return; // Evitar múltiples temporizadores
        syncCountdown = SYNC_RESET_TIME;
        updateSyncButtonState(); // Establecer el estado inicial

        syncTimerInterval = setInterval(() => {
            syncCountdown--;
            updateSyncButtonState(); // Actualizar el estado en cada tick

            if (syncCountdown <= 0) {
                stopSyncTimer();
                resetDpsMeter();
            }
        }, 1000);
    }

    function stopSyncTimer() {
        clearInterval(syncTimerInterval);
        syncTimerInterval = null;

    function getHealthColor(percentage) {
        const r1 = 220, g1 = 53, b1 = 69; // Rojo para HP bajo (#dc3545)
        const r2 = 40, g2 = 167, b2 = 69; // Verde para HP alto (#28a745)

        const r = Math.round(r1 + (r2 - r1) * (percentage / 100));
        const g = Math.round(g1 + (g2 - g1) * (percentage / 100));
        const b = Math.round(b1 + (b2 - b1) * (percentage / 100));

        return `rgb(${r}, ${g}, ${b})`;
    }

    function formatStat(value) {
        if (value >= 1000000000000) {
            return (Math.floor((value / 1000000000000) * 10) / 10) + 'T';
        }
        if (value >= 1000000000) {
            return (Math.floor((value / 1000000000) * 10) / 10) + 'G';
        }
        if (value >= 1000000) {
            return (Math.floor((value / 1000000) * 10) / 10) + 'M';
        }
        if (value >= 1000) {
            return (Math.floor((value / 1000) * 10) / 10) + 'k';
        }
        return Math.floor(value).toFixed(0);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const debugTexts = [
            '# VSCode Visible Files',
            '# VSCode Open Tabs',
            '# Current Time',
            '# Context Window Usage',
            '# Current Mode'
        ];

        // Función para buscar y eliminar nodos de texto o elementos que contengan el texto
        function removeDebugText() {
            const allElements = document.body.querySelectorAll('*');
            allElements.forEach(element => {
                debugTexts.forEach(debugText => {
                    if (element.textContent.includes(debugText)) {
                        // Si el texto está directamente en el elemento, o es un elemento que contiene solo ese texto
                        if (element.childNodes.length === 1 && element.firstChild.nodeType === Node.TEXT_NODE && element.firstChild.textContent.includes(debugText)) {
                            element.remove();
                        } else {
                            // Si el texto es parte de un nodo de texto más grande, intentar eliminar solo el nodo de texto
                            Array.from(element.childNodes).forEach(node => {
                                if (node.nodeType === Node.TEXT_NODE && node.textContent.includes(debugText)) {
                                    node.remove();
                                }
                            });
                        }
                    }
                });
            });

            // También buscar directamente en el body si hay nodos de texto sueltos
            Array.from(document.body.childNodes).forEach(node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    debugTexts.forEach(debugText => {
                        if (node.textContent.includes(debugText)) {
                            node.remove();
                        }
                    });
                }
            });
        }

        // Ejecutar la función inmediatamente y luego con un pequeño retraso para capturar inyecciones tardías
        removeDebugText();
    setTimeout(removeDebugText, 500); // Reintentar después de 500ms

            <table class="skill-table" id="skillTable">
                <thead>
                    <tr>
                        <th>Skill</th><th>Type</th><th>Element</th><th>Critical %</th><th>Luck</th><th>Normal DMG</th><th>Total DMG</th><th>Hits</th>
                    </tr>
                </thead>
                <tbody id="skillTableBody"><tr><td colspan="8">Select a player to view skill breakdown.</td></tr></tbody>
            </table>
    </div>
</div>`;
                                document.body.appendChild(skillContainer);
                        }

            // Hide main bars and show skill container
            const bars = document.getElementById('player-bars-container');
            if (bars) bars.style.display = 'none';
            skillContainer.style.display = '';

            // If module not yet loaded, load the canonical ASCII-named module only
            if (typeof window.initSkillAnalysisView !== 'function') {
                await new Promise((resolve) => {
                    const s = document.createElement('script');
                    s.src = '/js/modules/analisis-combo.js';
                    s.onload = () => resolve();
                    s.onerror = () => {
                        console.warn('Failed to load /js/modules/analisis-combo.js');
                        resolve();
                    };
                    document.head.appendChild(s);
                });
            }

            // Call the module initializer if available
            if (typeof window.initSkillAnalysisView === 'function') {
                try {
                    window.initSkillAnalysisView();
                    // Resize window to fit Skill Analysis immediately after init
                    if (typeof updateWindowSize === 'function') updateWindowSize();
                } catch (e) {
                    console.error('Error initializing Skill Analysis view', e);
                }
            } else {
                console.warn('Skill Analysis module not available after loading attempts.');
            }
        });
    })();
    </script>
</body>
</html>
